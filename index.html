<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kumar Loot - Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* 🌟 GLOBAL STYLES */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background: #0f172a; color: #fff; user-select: none; overflow-x: hidden; }
        
        /* 🔐 AUTH SCREENS */
        #auth-screen { display: flex; min-height: 100vh; padding: 20px; align-items: center; justify-content: center; flex-direction: column; }
        .auth-box { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 30px; width: 100%; max-width: 380px; text-align: center; }
        .input-group { position: relative; margin-bottom: 15px; }
        .input-group i { position: absolute; left: 15px; top: 14px; color: #888; }
        .custom-input { width: 100%; padding: 12px 15px 12px 45px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.2); color: #fff; border-radius: 12px; outline: none; }
        .primary-btn { width: 100%; padding: 12px; background: linear-gradient(45deg, #4f46e5, #3b82f6); border: none; border-radius: 12px; color: white; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .switch-text { font-size: 13px; color: #aaa; margin-top: 15px; cursor: pointer; text-decoration: underline; }
        
        /* 🧮 MATH CAPTCHA */
        .math-box { background: rgba(0,0,0,0.4); padding: 15px; border-radius: 10px; margin-bottom: 15px; text-align: left; }
        .math-box h4 { font-size: 12px; color: #38bdf8; margin-bottom: 10px; text-align: center; }
        .math-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 14px; }
        .math-input { width: 60px; padding: 5px; border-radius: 5px; border: none; text-align: center; background: #fff; color: #000; font-weight: bold; }

        /* 📱 APP DASHBOARD */
        #app-screen { display: none; padding-bottom: 80px; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 20px; background: rgba(0,0,0,0.2); }
        .balance-card { margin: 15px; padding: 20px; border-radius: 15px; background: linear-gradient(135deg, #10b981, #059669); text-align: center; box-shadow: 0 10px 20px rgba(16, 185, 129, 0.3); }
        
        /* 🎮 GAME SECTION */
        .game-section { margin: 20px; padding: 20px; background: rgba(255,255,255,0.05); border-radius: 15px; border: 1px solid rgba(255,255,255,0.1); text-align: center; }
        .coin { width: 100px; height: 100px; background: #fbbf24; border-radius: 50%; margin: 20px auto; display: flex; align-items: center; justify-content: center; font-size: 40px; font-weight: bold; color: #b45309; border: 5px solid #d97706; transition: transform 1s; }
        .game-btn { padding: 10px 20px; border: none; border-radius: 10px; font-weight: bold; margin: 5px; cursor: pointer; }
        .btn-heads { background: #3b82f6; color: white; }
        .btn-tails { background: #ef4444; color: white; }
        .claim-btn { display: none; width: 100%; padding: 15px; background: #ef4444; color: white; font-weight: bold; border: none; border-radius: 10px; margin-top: 15px; animation: pulse 1s infinite; cursor: pointer; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

    <!-- 🔐 LOGIN / REGISTER SCREENS -->
    <div id="auth-screen">
        
        <!-- LOGIN VIEW -->
        <div class="auth-box" id="login-view">
            <h2 style="color: #38bdf8; margin-bottom: 20px;">🔥 Kumar Loot</h2>
            
            <div class="input-group">
                <i class="fa-solid fa-phone"></i>
                <input type="number" id="login-num" class="custom-input" placeholder="Mobile Number">
            </div>
            <div class="input-group">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="login-pass" class="custom-input" placeholder="Password">
            </div>
            
            <button class="primary-btn" onclick="login()">Login</button>
            <div id="login-err" style="color: #ff4d4d; font-size: 12px; margin-top: 10px;"></div>
            <p class="switch-text" onclick="switchView('register')">New user? Register here</p>
        </div>

        <!-- REGISTER VIEW -->
        <div class="auth-box" id="register-view" style="display: none;">
            <h2 style="color: #10b981; margin-bottom: 10px;">Create Account</h2>
            
            <div class="input-group">
                <i class="fa-solid fa-phone"></i>
                <input type="number" id="reg-num" class="custom-input" placeholder="Mobile Number">
            </div>
            <div class="input-group">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="reg-pass" class="custom-input" placeholder="Create Password">
            </div>

            <!-- Math Captcha -->
            <div class="math-box">
                <h4>Solve any 2 to prove you are human</h4>
                <div class="math-row"><span id="q1"></span> <input type="number" id="a1" class="math-input"></div>
                <div class="math-row"><span id="q2"></span> <input type="number" id="a2" class="math-input"></div>
                <div class="math-row"><span id="q3"></span> <input type="number" id="a3" class="math-input"></div>
            </div>
            
            <button class="primary-btn" onclick="register()">Create Account</button>
            <div id="reg-err" style="color: #ff4d4d; font-size: 12px; margin-top: 10px;"></div>
            <p class="switch-text" onclick="switchView('login')">Already have an account? Login</p>
        </div>
    </div>

    <!-- 📱 APP DASHBOARD -->
    <div id="app-screen">
        <div class="header">
            <h3>Hello, <span id="user-display" style="color: #38bdf8;">User</span>!</h3>
            <div onclick="logOut()" style="background: rgba(255,255,255,0.1); padding: 8px 12px; border-radius: 10px; font-size: 12px; cursor: pointer;">Logout</div>
        </div>

        <div class="balance-card">
            <div style="font-size: 14px;">Total Wallet Balance</div>
            <div style="font-size: 35px; font-weight: 800;">₹<span id="balance">0.00</span></div>
        </div>

        <!-- 🎮 LIVE GAME SECTION -->
        <div class="game-section">
            <h3 style="color: #fbbf24;">Coin Flip Challenge</h3>
            <p style="font-size: 12px; color: #aaa;">Win the toss to claim ₹0.10 Adsterra Bonus!</p>
            
            <div class="coin" id="coin-display">?</div>
            
            <div id="game-controls">
                <button class="game-btn btn-heads" onclick="playGame('Heads')">Choose HEADS</button>
                <button class="game-btn btn-tails" onclick="playGame('Tails')">Choose TAILS</button>
            </div>
            
            <p id="game-result" style="margin-top: 15px; font-weight: bold;"></p>
            
            <!-- 🔥 Claim Ad Button (Hidden until win) -->
            <button id="claim-ad-btn" class="claim-btn" onclick="claimBonus()">🎁 Watch Ad to Claim ₹0.10</button>
        </div>
    </div>

    <!-- 🛠️ FIREBASE & LOGIC SCRIPT -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, get, set, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // 🚨 तुझी Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyCewAWzj09CsJWJRqZ16TmWN6Z-d0ATyaM",
            authDomain: "kumar-loot.firebaseapp.com",
            projectId: "kumar-loot",
            storageBucket: "kumar-loot.firebasestorage.app",
            messagingSenderId: "264932703737",
            appId: "1:264932703737:web:2cc50a8bbe1923917b5128"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        let currentUserUid = null;

        // View Switcher
        window.switchView = (view) => {
            document.getElementById('login-view').style.display = view === 'login' ? 'block' : 'none';
            document.getElementById('register-view').style.display = view === 'register' ? 'block' : 'none';
            if(view === 'register') generateMath();
        };

        // 🧮 Math Captcha Logic
        let mathAnswers = [];
        function generateMath() {
            mathAnswers = [];
            for(let i=1; i<=3; i++) {
                let n1 = Math.floor(Math.random() * 10) + 1;
                let n2 = Math.floor(Math.random() * 10) + 1;
                let op = Math.random() > 0.5 ? '+' : '-';
                // Avoid negative answers
                if(op === '-' && n1 < n2) [n1, n2] = [n2, n1]; 
                
                document.getElementById(`q${i}`).innerText = `${n1} ${op} ${n2} = `;
                mathAnswers.push(op === '+' ? n1 + n2 : n1 - n2);
                document.getElementById(`a${i}`).value = ''; // clear old inputs
            }
        }
        window.onload = generateMath;

        // Trick: Firebase needs Email, so we convert Number to a hidden fake email.
        const formatNum = (num) => `${num}@kumarloot.app`; 

        // 🟢 REGISTER (With Math Check)
        window.register = async () => {
            const num = document.getElementById('reg-num').value;
            const pass = document.getElementById('reg-pass').value;
            const errBox = document.getElementById('reg-err');

            if(num.length < 10 || pass.length < 6) {
                return errBox.innerText = "Enter valid 10-digit number & 6+ char password!";
            }

            // Check Math (Need 2 correct)
            let score = 0;
            for(let i=1; i<=3; i++) {
                let userAns = parseInt(document.getElementById(`a${i}`).value);
                if(userAns === mathAnswers[i-1]) score++;
            }

            if(score < 2) {
                generateMath(); // Reset questions
                return errBox.innerText = "Math failed! Please answer at least 2 correctly.";
            }

            try {
                errBox.innerText = "Creating account...";
                const userCred = await createUserWithEmailAndPassword(auth, formatNum(num), pass);
                // Save user in Database with 0 balance
                await set(ref(db, `users/${userCred.user.uid}`), { phone: num, balance: 0.00 });
                errBox.innerText = "Account Created!";
            } catch (error) {
                errBox.innerText = "Number already registered or error occurred!";
                generateMath();
            }
        };

        // 🟢 LOGIN
        window.login = async () => {
            const num = document.getElementById('login-num').value;
            const pass = document.getElementById('login-pass').value;
            const errBox = document.getElementById('login-err');

            if(!num || !pass) return errBox.innerText = "Enter Number & Password!";

            try {
                errBox.innerText = "Logging in...";
                await signInWithEmailAndPassword(auth, formatNum(num), pass);
            } catch (error) {
                errBox.innerText = "Invalid Number or Password!";
            }
        };

        // 🛡️ SECURITY & LOAD DATA (1 Device = 1 User Logic)
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUserUid = user.uid;
                
                // Get Device ID
                let deviceId = "unknown";
                try {
                    const fp = await import('https://openfpcdn.io/fingerprintjs/v4');
                    const fpInstance = await fp.default.load();
                    const result = await fpInstance.get();
                    deviceId = result.visitorId;
                } catch(e) { deviceId = "fallback-" + user.uid; }

                // Check Device Lock
                const dbRef = ref(db);
                const deviceSnap = await get(child(dbRef, `devices/${deviceId}`));

                if (deviceSnap.exists() && deviceSnap.val() !== user.uid) {
                    // 🚫 2 IDs on 1 Device -> BLOCKED!
                    alert("⚠️ SECURITY: Another account is already registered on this device!");
                    signOut(auth);
                    return;
                } else {
                    // ✅ Allow and Register Device (Supports 2 Devices for 1 ID)
                    if (!deviceSnap.exists()) { set(ref(db, `devices/${deviceId}`), user.uid); }

                    // Load UI & Balance
                    document.getElementById('auth-screen').style.display = 'none';
                    document.getElementById('app-screen').style.display = 'block';
                    document.getElementById('user-display').innerText = user.email.split('@')[0];
                    
                    fetchBalance();
                }
            } else {
                document.getElementById('auth-screen').style.display = 'flex';
                document.getElementById('app-screen').style.display = 'none';
            }
        });

        // 💰 BALANCE SYSTEM
        async function fetchBalance() {
            const snap = await get(ref(db, `users/${currentUserUid}/balance`));
            const bal = snap.exists() ? snap.val() : 0.00;
            document.getElementById('balance').innerText = parseFloat(bal).toFixed(2);
        }

        window.logOut = () => signOut(auth);

        // 🎮 GAME LOGIC (Coin Flip)
        window.playGame = (userChoice) => {
            const coin = document.getElementById('coin-display');
            const resultText = document.getElementById('game-result');
            const claimBtn = document.getElementById('claim-ad-btn');
            
            coin.style.transform = "rotateY(720deg)";
            resultText.innerText = "Flipping...";
            resultText.style.color = "#fff";
            claimBtn.style.display = 'none';
            document.getElementById('game-controls').style.display = 'none';

            setTimeout(() => {
                coin.style.transform = "rotateY(0deg)";
                const outcomes = ['Heads', 'Tails'];
                const result = outcomes[Math.floor(Math.random() * 2)];
                coin.innerText = result.charAt(0); // H or T

                if(userChoice === result) {
                    resultText.innerText = `🎉 It's ${result}! YOU WIN!`;
                    resultText.style.color = "#10b981";
                    claimBtn.style.display = 'block'; // Show Ad Claim Button
                } else {
                    resultText.innerText = `😢 It's ${result}. You lost. Try again!`;
                    resultText.style.color = "#ef4444";
                    document.getElementById('game-controls').style.display = 'block';
                }
            }, 1000);
        };

        // 🎁 CLAIM BONUS (Adsterra)
        window.claimBonus = async () => {
            // 🚨🚨 ADSTERRA DIRECT LINK 🚨🚨
            const adsterraLink = "TUZHI_ADSTERRA_DIRECT_LINK_ITHE_TAK"; 

            // Firebase Update Balance
            const snap = await get(ref(db, `users/${currentUserUid}/balance`));
            let currentBal = snap.exists() ? snap.val() : 0.00;
            currentBal += 0.10;
            
            await update(ref(db, `users/${currentUserUid}`), { balance: currentBal });
            fetchBalance(); // Refresh UI

            // Reset Game
            document.getElementById('claim-ad-btn').style.display = 'none';
            document.getElementById('game-controls').style.display = 'block';
            document.getElementById('game-result').innerText = "";
            document.getElementById('coin-display').innerText = "?";

            alert("🎉 Task Verified! ₹0.10 added to your wallet. Opening Bonus Page...");
            window.open(adsterraLink, '_blank'); // Open Ad
        };
    </script>
</body>
</html>
